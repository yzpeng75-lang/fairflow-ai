<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FairFlow AI project cover</title>
  <desc id="desc">A dark green cover showing a checkout price journey and the FairFlow tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2117"/><stop offset="1" stop-color="#030806"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#67f0ad" stop-opacity=".25"/><stop offset="1" stop-color="#67f0ad" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="360" fill="url(#glow)"/>
  <g transform="translate(88 72)">
    <rect width="56" height="56" rx="16" fill="#67f0ad"/><text x="28" y="39" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#07110c">F</text>
    <text x="76" y="36" font-family="Arial" font-size="26" font-weight="700" fill="#eaf8f0">FairFlow AI</text>
  </g>
  <text x="88" y="254" font-family="Arial" font-size="76" font-weight="700" fill="#f0fff6">See the real cost</text>
  <text x="88" y="338" font-family="Arial" font-size="76" font-weight="700" fill="#f0fff6">before you click.</text>
  <text x="92" y="398" font-family="Arial" font-size="23" fill="#9bb3a7">Evidence-based protection from hidden fees, preselected extras, and late renewals.</text>
  <g transform="translate(92 495)" font-family="Arial">
    <text y="-20" font-size="14" font-weight="700" letter-spacing="2" fill="#67f0ad">CHECKOUT PRICE TRACE</text>
    <path d="M0 72H250L330 72L410 20H690" fill="none" stroke="#67f0ad" stroke-width="5"/>
    <g fill="#67f0ad"><circle cx="0" cy="72" r="9"/><circle cx="250" cy="72" r="9"/><circle cx="410" cy="20" r="9"/><circle cx="690" cy="20" r="9"/></g>
    <g font-size="15" fill="#a9bcb1"><text x="0" y="105">PRODUCT</text><text x="225" y="105">CART</text><text x="380" y="-8">REVIEW</text><text x="625" y="-8">EVIDENCE</text></g>
    <text x="744" y="28" font-size="48" font-weight="700" fill="#f2a083">+ $60</text>
    <text x="748" y="60" font-size="15" fill="#d7a28f">MANDATORY FEE APPEARED LATE</text>
  </g>
  <text x="92" y="675" font-family="Arial" font-size="14" letter-spacing="2" fill="#61796d">PRIVACY-FIRST · TEMPORAL · EXPLAINABLE</text>
</svg>

